PLG_SYSTEM_RKQTAVATAR_FIELD_SHOW_PICKER_DESC="When off, only the automatic avatar is used."
PLG_SYSTEM_RKQTAVATAR_FIELD_REMEMBER_LABEL="Remember the choice"
PLG_SYSTEM_RKQTAVATAR_FIELD_REMEMBER_DESC="Remember the chosen avatar in the visitor's browser for the next comment."
