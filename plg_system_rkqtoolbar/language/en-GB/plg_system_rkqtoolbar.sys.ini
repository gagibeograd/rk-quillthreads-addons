PLG_SYSTEM_RKQTOOLBAR="System - RK QuillThreads toolbar"
PLG_SYSTEM_RKQTOOLBAR_XML_DESCRIPTION="Adds a toolbar above the QuillThreads comment box: bold, italic, link, quote, list, code, YouTube (link prompt) and an emoji picker with search. YouTube links in published comments become a click-to-play player and a modal. Loads only when QuillThreads formatting is Markdown or limited HTML."
